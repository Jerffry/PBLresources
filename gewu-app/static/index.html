<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>格物 · 教学设计智能体</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='%231a4f8a'/%3E%3Cellipse cx='24' cy='24' rx='9' ry='20' fill='none' stroke='%23fff' stroke-width='1.5' opacity='.8'/%3E%3Cline x1='4' y1='24' x2='44' y2='24' stroke='%23fff' stroke-width='1.5' opacity='.8'/%3E%3Cellipse cx='24' cy='13' rx='17' ry='5.5' fill='none' stroke='%23fff' opacity='.55'/%3E%3Cellipse cx='24' cy='35' rx='17' ry='5.5' fill='none' stroke='%23fff' opacity='.55'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="globe-icon">
  <circle cx="24" cy="24" r="20" fill="#1a4f8a"/>
  <ellipse cx="24" cy="24" rx="9" ry="20" fill="none" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  <line x1="4" y1="24" x2="44" y2="24" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  <ellipse cx="24" cy="13" rx="17" ry="5.5" fill="none" stroke="#fff" opacity=".55"/>
  <ellipse cx="24" cy="35" rx="17" ry="5.5" fill="none" stroke="#fff" opacity=".55"/>
</g>
</defs></svg>

<div id="app">
  <aside id="sidebar">
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 48 48"><use href="#globe-icon"/></svg>
      <div class="logo-text"><b>格物</b><small>高中地理教学设计智能体</small></div>
    </div>
    <button id="btnNew" class="primary">＋ 新建设计项目</button>
    <div id="projectList"></div>
    <div class="foot"><span class="dot"></span><span id="llmState">检测中…</span><br>格物 · V2.8 本地版</div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button id="btnMenu" class="ghost" title="项目列表">☰</button>
      <div id="projTitle">选择或新建项目</div>
      <span id="modeBadge" class="mode-badge hidden"></span>
      <span id="userChip" class="user-chip hidden"></span>
      <div class="spacer"></div>
      <button id="btnSwitch" class="ghost hidden" title="在两条设计主线间切换，自动携带进度与产出摘要">⇄ 切换模式</button>
      <button id="btnExport" class="ghost hidden" title="将方案包按件拆分为md并打包zip下载">📦 导出方案包</button>
      <button id="btnLogout" class="ghost hidden" title="退出登录">⏻</button>
    </header>

    <div id="nodeFlow" class="hidden"></div>
    <div id="corePanel" class="hidden"></div>

    <div id="chat" class="empty">
      <div id="emptyHint">
        <svg class="globe" viewBox="0 0 48 48"><use href="#globe-icon"/></svg>
        <div class="big">格物致知 · 物格而后知至</div>
        <p id="hintText">新建项目并输入课题名称，格物将从第一个节点开始，逐环节生成教学设计方案。</p>
        <div id="quickChips" class="hidden">
          <button class="chip">海洋空间资源开发与国家安全</button>
          <button class="chip">气候变化与国家安全</button>
          <button class="chip">黄河流域生态保护</button>
          <button class="chip">产业转型地区的结构优化</button>
        </div>
      </div>
    </div>

    <button id="scrollFab" title="回到底部">↓</button>

    <!-- SOLO 速查：情境化弹出层（撰写目标时在输入区调出） -->
    <div id="soloPop" class="hidden">
      <div class="solo-head">SOLO 分层速查 · 行为动词白名单</div>
      <div id="soloTable"></div>
    </div>

    <!-- 格物 · 学生地球小人（可拖拽，状态感知吉样物） -->
    <div id="mascot" title="格物 · 拖我到你喜欢的位置，点我看小贴士">
      <div id="mascotBubble" class="hidden"><span id="mascotText"></span></div>
      <svg id="mascotSvg" viewBox="0 0 120 132" aria-label="格物">
        <!-- 脚：小白鞋 -->
        <ellipse cx="47" cy="122" rx="8" ry="4.6" fill="#FFFFFF" stroke="#173A56" stroke-width="1.6"/>
        <ellipse cx="73" cy="122" rx="8" ry="4.6" fill="#FFFFFF" stroke="#173A56" stroke-width="1.6"/>
        <!-- 身体：浅蓝学生卫衣 -->
        <path d="M40 86 Q60 78 80 86 L87 114 Q60 123 33 114 Z" fill="#7EB1DF"/>
        <path d="M36 109 Q60 117 84 109 L87 114 Q60 123 33 114 Z" fill="#5D8FC4"/>
        <!-- 白衬衫领 -->
        <path d="M52 83 L60 93 L55 81 Z" fill="#FFFFFF"/>
        <path d="M68 83 L60 93 L65 81 Z" fill="#FFFFFF"/>
        <!-- 怀里抱的书（金色封面+白色书页） -->
        <g transform="rotate(-5 60 104)">
          <path d="M44 96 Q60 89 76 96 L76 112 Q60 105 44 112 Z" fill="#C9A24B"/>
          <path d="M48 97 Q60 92 72 97 L72 110 Q60 105 48 110 Z" fill="#FFFFFF"/>
          <line x1="60" y1="94" x2="60" y2="110" stroke="#D8CBA8" stroke-width="1.6"/>
        </g>
        <!-- 手臂：袖口环抱书本（悬停挥手） -->
        <g class="m-arm-l">
          <path d="M39 92 Q30 98 43 100" stroke="#6FA0D6" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="45" cy="100" r="3.8" fill="#FFFFFF"/>
        </g>
        <g class="m-arm-r">
          <path d="M81 92 Q90 98 77 100" stroke="#6FA0D6" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="75" cy="100" r="3.8" fill="#FFFFFF"/>
        </g>
        <!-- 地球脑袋 -->
        <circle cx="60" cy="56" r="31" fill="#1A4F8A"/>
        <ellipse cx="60" cy="56" rx="11" ry="31" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".65"/>
        <line x1="29" y1="56" x2="91" y2="56" stroke="#FFFFFF" stroke-width="1.6" opacity=".65"/>
        <ellipse cx="60" cy="40" rx="25" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".4"/>
        <ellipse cx="60" cy="72" rx="25" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".4"/>
        <!-- 陆地色块 -->
        <path d="M36 48 Q44 38 54 44 Q60 40 58 50 Q52 58 42 54 Q34 54 36 48Z" fill="#2E7D52" opacity=".75"/>
        <path d="M68 66 Q78 62 82 70 Q78 78 70 74 Q64 72 68 66Z" fill="#2E7D52" opacity=".75"/>
        <!-- 眼睛（眨眼动画） -->
        <g class="m-eyes">
          <circle class="m-eye" cx="50" cy="55" r="3.4" fill="#0B1F33"/>
          <circle class="m-eye" cx="70" cy="55" r="3.4" fill="#0B1F33"/>
          <circle cx="51.2" cy="53.8" r="1" fill="#fff"/>
          <circle cx="71.2" cy="53.8" r="1" fill="#fff"/>
        </g>
        <!-- 腮红 -->
        <circle cx="42" cy="63" r="3.4" fill="#E8927C" opacity=".55"/>
        <circle cx="78" cy="63" r="3.4" fill="#E8927C" opacity=".55"/>
        <!-- 微笑 -->
        <path d="M53 64 Q60 70 67 64" stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <footer id="inputBar" class="hidden">
      <button id="btnSolo" class="ghost" title="SOLO 分层速查（四级行为动词白名单）">📐</button>
      <textarea id="input" rows="1" placeholder="输入课题名称，或回复当前节点…（Enter发送，Shift+Enter换行）"></textarea>
      <button id="btnSend" class="primary">发送</button>
    </footer>
  </main>
</div>

<div id="modalNew" class="modal hidden">
  <div class="card">
    <h3>新建设计项目</h3>
    <label>课题名称</label>
    <input id="npTitle" placeholder="如：海洋空间资源开发与国家安全">
    <label>设计模式</label>
    <div class="mode-pick">
      <label class="pick"><input type="radio" name="npmode" value="global" checked><div><b>🌍 全球胜任力</b><small>论文五步策略 · N0–N6 · 方案包六件套（1课时为主）</small></div></label>
      <label class="pick"><input type="radio" name="npmode" value="theme"><div><b>🧩 跨学科主题学习</b><small>课标-教材-主题四核-工具-课件 · M1–M5 · 问题链＋五件套</small></div></label>
    </div>
    <div class="row">
      <button id="npCancel" class="ghost">取消</button>
      <button id="npCreate" class="primary">创建并开始</button>
    </div>
  </div>
</div>

<div id="modalRename" class="modal hidden">
  <div class="card">
    <h3>重命名课题</h3>
    <label>课题名称</label>
    <input id="rnTitle" maxlength="60">
    <div class="row">
      <button id="rnCancel" class="ghost">取消</button>
      <button id="rnSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="toastBox"></div>
<script src="/static/app.js"></script>
</body>
</html>
